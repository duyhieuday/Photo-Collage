name: Release (APK + AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName, vd 1.0.4. Bo trong = giu nguyen gia tri trong app/build.gradle'
        required: false
        type: string
      version_code:
        description: 'versionCode, vd 4. Play Console tu choi neu trung ban da upload. Bo trong = giu nguyen'
        required: false
        type: string

jobs:
  release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Thieu GitHub Secrets:$missing - them tai Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          if [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::Giai ma KEYSTORE_BASE64 ra file rong - kiem tra lai chuoi base64"
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          # Tag push: lay versionName tu tag (v1.0.4 -> 1.0.4). workflow_dispatch: lay tu input.
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ inputs.version_name }}"
          fi
          CODE="${{ inputs.version_code }}"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName override: ${NAME:-(giu nguyen build.gradle)}"
          echo "versionCode override: ${CODE:-(giu nguyen build.gradle)}"

      - name: Build release AAB + APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          GPR_USER: ${{ secrets.GPR_USER || 'MCT-LIB' }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      # Chi IN chu ky ra job summary, KHONG so sanh voi gia tri nao.
      # Nguon duy nhat biet duoc upload key that la Play Console > Setup > App integrity
      # > App signing > Upload key certificate. Truoc day step nay hardcode mot SHA-1 lay
      # tu app/release/app-release.apk (build output commit san trong repo) va goi do la
      # upload key — day chi la suy doan, khong co gi xac minh.
      - name: Print signing certificate
        run: |
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          echo "## Chu ky ban release" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Doi chieu SHA-1 tren voi Upload key certificate trong Play Console" \
            "truoc khi upload AAB." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
