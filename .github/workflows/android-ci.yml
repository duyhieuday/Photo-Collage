name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # gradlew duoc commit voi mode 100644 (khong co exec bit) nen phai chmod tren Linux
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # build.gradle doc 2 bien nay cho maven repo MCT-LIB/CommonLibrary.
          # Neu chua tao secret thi chuoi rong -> hanh vi giong y hien tai.
          GPR_USER: ${{ secrets.GPR_USER || 'MCT-LIB' }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
